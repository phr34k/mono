# Static GRUB config for bootc/ostree on the Raspberry Pi CM4 (Debian).
#
# Loaded by BOOTAA64.EFI (built with prefix /EFI/BOOT). This replaces Fedora's
# bootupd-stitched grub2-static config.d + UUID-stamped stub. Instead of stamping
# the /boot UUID, we locate the ext4 /boot partition by a marker file the
# install-time bootupctl shim drops there, then blscfg loads the Boot Loader
# Spec entries ostree writes to /boot/loader/entries.
#
# NOTE: this is a best-effort config -- validate/adjust on real hardware (the
# blscfg entry-path resolution and /boot discovery are layout-dependent).

set timeout=1
set timeout_style=hidden

insmod part_msdos
insmod part_gpt
insmod ext2
insmod fat
insmod blscfg
insmod all_video
insmod gfxterm
insmod search
insmod search_fs_file

# Point $root at the ext4 /boot partition (marker written by the shim at install).
search --no-floppy --file --set=root /bootc-boot-partition

# --- greenboot boot counting / auto-rollback --------------------------------
# greenboot-set-rollback-trigger.service arms boot_counter on the first boot of a
# freshly-staged deployment; greenboot-healthcheck.service sets boot_success=1 and
# clears boot_counter once the required.d health checks pass. Here, while a boot is
# still unconfirmed (counter armed AND success != 1), decrement the counter; when
# it hits 0, boot the PREVIOUS deployment (blscfg lists entries newest-first, so
# default=1 = rollback) -- and greenboot then makes that rollback sticky via
# `bootc rollback`. Finally reset boot_success=0 so THIS boot must re-prove itself.
# A watchdog + panic=N (image kargs) turn a hang/panic into a reboot so the counter
# can actually advance instead of the machine sitting on a black screen.
# NB: keep the `--file ($root)/grub2/grubenv` form -- greenboot's grub2-editenv
# writes that ext4 grubenv, whereas a bare save_env would target $prefix/grubenv on
# the FAT ESP and the two would silently diverge. Logic matches greenboot's
# grub2/08_greenboot.cfg (which this static config replaces, since we boot our own
# grub.cfg rather than bootupd's stitched grub2-static config).
insmod increment
set default=0
if [ -f ($root)/grub2/grubenv ]; then
    load_env --file ($root)/grub2/grubenv boot_counter boot_success
fi
if [ -n "${boot_counter}" -a "${boot_success}" = "0" ]; then
    if [ "${boot_counter}" = "0" -o "${boot_counter}" = "-1" ]; then
        set default=1
        set boot_counter=-1
    else
        decrement boot_counter
    fi
    save_env --file ($root)/grub2/grubenv boot_counter
fi
set boot_success=0
save_env --file ($root)/grub2/grubenv boot_success

# Load the BLS Type#1 entries ostree writes to $root/loader/entries.
blscfg
