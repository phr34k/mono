# Static GRUB config for bootc/ostree on the Raspberry Pi CM4 (Debian).
#
# Loaded by BOOTAA64.EFI (built with prefix /EFI/BOOT). This replaces Fedora's
# bootupd-stitched grub2-static config.d + UUID-stamped stub. Instead of stamping
# the /boot UUID, we locate the ext4 /boot partition by a marker file the
# install-time bootupctl shim drops there, then blscfg loads the Boot Loader
# Spec entries ostree writes to /boot/loader/entries.
#
# NOTE: this is a best-effort config -- validate/adjust on real hardware (the
# blscfg entry-path resolution and /boot discovery are layout-dependent).

set timeout=1
set timeout_style=hidden

insmod part_msdos
insmod part_gpt
insmod ext2
insmod fat
insmod blscfg
insmod all_video
insmod gfxterm
insmod search
insmod search_fs_file

# Point $root at the ext4 /boot partition (marker written by the shim at install).
search --no-floppy --file --set=root /bootc-boot-partition

# Load the BLS Type#1 entries ostree writes to $root/loader/entries.
blscfg
