# Boot straight to the default entry, but reveal the GRUB menu if ESC (or a key)
# is pressed during the 1s window. This overrides grub-static-pre.cfg's default
# of `set timeout_style=menu` (it already sets `set timeout=1`).
#
# bootupd concatenates configs.d/*.cfg in sorted order. This file is installed
# as 13_hidden_menu.cfg so it lands after 10_blscfg but BEFORE
# 14_menu_show_once.cfg — that way a one-shot `menu_show_once_timeout` (the
# bootupd/recovery path) can still force the menu to appear when it needs to.
set timeout_style=hidden
set timeout=1
